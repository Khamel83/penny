[llm]
model = "google/gemini-2.5-flash-lite"

[google_tasks]
list_name = "My Tasks"
poll_interval_seconds = 180

[apple_reminders]
# These must exactly match list names in your Reminders app
lists = ["Groceries", "Errands", "Home", "Health", "Work", "Kids", "Inbox"]
default_list = "Inbox"

[voice_memos]
max_file_size_mb = 50
# Durable identity only. Runtime resolves the verified local path below and
# never passes this repository ID to MLX or the Hugging Face client.
whisper_model = "mlx-community/whisper-large-v3-turbo@a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb"
whisper_model_repository = "mlx-community/whisper-large-v3-turbo"
whisper_model_revision = "a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb"
whisper_model_path = "~/.penny/models/whisper-large-v3-turbo/a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb"
poll_interval_seconds = 60
startup_process_limit = 5

[webhook]
port = 5678
host = "127.0.0.1"

[logging]
# level: DEBUG, INFO, WARNING, ERROR
level = "INFO"

[notifications]
# Set to false to silence Telegram without removing the integration
telegram_enabled = false

[maya]
# URL for Maya's POST /ingest/transcript endpoint.
# Overridden by env var MAYA_TRANSCRIPT_URL (set in the launchd plists).
transcript_url = ""

# Bearer token for Maya ingest auth. NEVER set here — use env var
# MAYA_INGEST_TOKEN (must equal Maya's MAYA_INGEST_TOKEN).
ingest_token = ""

# Bounds each Maya attempt so its outage cannot starve the Slack outbox.
# Overridden by MAYA_DELIVERY_TIMEOUT_SECONDS and clamped to 1..30 seconds.
delivery_timeout_seconds = 10

# A transient Maya delivery is retried at most 20 times and for at most 7 days.
# Environment overrides are MAYA_DELIVERY_MAX_ATTEMPTS and
# MAYA_DELIVERY_MAX_AGE_DAYS; both are clamped to the documented maxima.
max_attempts = 20
max_age_days = 7

[archive]
# Penny-owned durable objects must remain outside iCloud/File Provider storage.
object_root = "~/.penny/archive/objects"

# Approved hydrated iCloud Drive mirror. Override only with
# PENNY_ARCHIVE_MIRROR_ROOT; this mirror is not the durable object store.
mirror_root = "~/Library/Mobile Documents/com~apple~CloudDocs/Penny Archive"
delivery_batch_limit = 5
