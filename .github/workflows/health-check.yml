name: Penny Health Check

on:
  schedule:
    - cron: '0 9 * * *'  # 9am UTC daily (2am PT)
  workflow_dispatch:      # allow manual trigger

jobs:
  health-check:
    runs-on: [self-hosted, oci-dev]

    steps:
      - name: Check launchd services
        run: |
          ssh macmini "launchctl list | grep penny" | tee /tmp/penny_status.txt
          # Expect 3 lines with com.penny.* (watcher, tasks, webhook; export is StartInterval-based)
          COUNT=$(grep -c "com.penny" /tmp/penny_status.txt)
          if [ "$COUNT" -ne 3 ]; then
            echo "ERROR: Expected 3 penny services, found $COUNT"
            cat /tmp/penny_status.txt
            exit 1
          fi
          echo "All 3 services present."

      - name: Check all services are running (have a PID)
        run: |
          STOPPED=$(ssh macmini "launchctl list | grep penny" | awk '{if ($1 == "-") print $3}')
          if [ -n "$STOPPED" ]; then
            echo "ERROR: Services not running:"
            echo "$STOPPED"
            exit 1
          fi
          echo "All services have a PID (running)."

      - name: Check watcher is polling (log updated in last 15 min)
        run: |
          LAST=$(ssh macmini "stat -f '%m' ~/.penny/logs/watcher.log")
          NOW=$(date +%s)
          AGE=$(( NOW - LAST ))
          if [ "$AGE" -gt 900 ]; then
            echo "ERROR: Watcher log last updated ${AGE}s ago (>15 min)"
            ssh macmini "tail -5 ~/.penny/logs/watcher.log"
            exit 1
          fi
          echo "Watcher log updated ${AGE}s ago. OK."

      - name: Check tasks poller connected
        run: |
          ERRORS=$(ssh macmini "tail -20 ~/.penny/logs/tasks.system.log" | grep -c "ERROR" || true)
          RECENT_OK=$(ssh macmini "tail -20 ~/.penny/logs/tasks.system.log" | grep -c "connected\|Processed\|No new tasks" || true)
          if [ "$ERRORS" -gt 0 ] && [ "$RECENT_OK" -eq 0 ]; then
            echo "ERROR: Tasks poller has recent errors and no successes"
            ssh macmini "tail -20 ~/.penny/logs/tasks.system.log"
            exit 1
          fi
          echo "Tasks poller OK."

      - name: Check transcript log exists and has recent entries
        run: |
          ssh macmini "sqlite3 ~/.penny/transcripts.db 'SELECT count(*) FROM transcripts;'" > /tmp/transcript_count.txt
          COUNT=$(cat /tmp/transcript_count.txt)
          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: Transcript log is empty (may be fresh install)"
          else
            echo "Transcript log has $COUNT entries."
          fi
          PENDING=$(ssh macmini "sqlite3 ~/.penny/transcripts.db \"SELECT count(*) FROM transcripts WHERE status IN ('pending','failed');\"")
          if [ "$PENDING" -gt 0 ]; then
            echo "WARNING: $PENDING transcript(s) stuck in pending/failed state"
          fi

      - name: Check VoiceMemos is running (required for CloudKit sync)
        run: |
          ssh macmini "pgrep -x VoiceMemos" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "ERROR: VoiceMemos is not running — CloudKit sync will fail"
            exit 1
          fi
          echo "VoiceMemos is running."
