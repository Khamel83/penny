name: Penny Health Check

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: [self-hosted, oci-dev]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SSH_MACMINI: "ssh -F /home/ubuntu/.ssh/config -o ConnectTimeout=15 macmini"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SSH connectivity
        run: |
          set -euo pipefail
          $SSH_MACMINI "echo SSH_OK" >/tmp/penny_ssh_probe.txt
          grep -qx SSH_OK /tmp/penny_ssh_probe.txt

      - name: Run read-only Penny Doctor
        run: |
          set +e
          $SSH_MACMINI \
            "cd /Users/macmini/penny && HF_HUB_OFFLINE=1 /Users/macmini/penny/venv/bin/python scripts/penny_doctor.py --json" \
            >/tmp/penny_doctor.json 2>/tmp/penny_doctor.stderr
          doctor_status=$?
          set -e

          # The Doctor JSON is already bounded to status, timestamps, hashes,
          # counters, and booleans.  Publish only those safe fields.
          jq -c '{overall, source_revision, observed_at, components: (.components | with_entries(.value |= {state, reason, details}))}' \
            /tmp/penny_doctor.json

          case "$doctor_status" in
            0) echo "Penny Doctor ready." ;;
            1) echo "Penny Doctor degraded; review component counters." ;;
            2) echo "Penny Doctor unready." >&2; exit 1 ;;
            *) echo "Penny Doctor returned an invalid status." >&2; exit 1 ;;
          esac
