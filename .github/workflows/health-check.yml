name: Penny Health Check

on:
  schedule:
    - cron: '0 9 * * *'  # 9am UTC daily (2am PT)
  workflow_dispatch:      # allow manual trigger

jobs:
  health-check:
    runs-on: [self-hosted, oci-dev]

    steps:
      - name: Check launchd services (expect 4 registered)
        run: |
          # 4 services: watcher, webhook, tasks (persistent) + export (StartInterval-based)
          ssh macmini "launchctl list | grep com.penny" | tee /tmp/penny_status.txt
          COUNT=$(grep -c "com.penny" /tmp/penny_status.txt)
          echo "Registered penny services: $COUNT"
          cat /tmp/penny_status.txt
          if [ "$COUNT" -ne 4 ]; then
            echo "ERROR: Expected 4 penny services registered, found $COUNT"
            echo "Check that all 4 plists are loaded: watcher, webhook, tasks, export"
            exit 1
          fi
          echo "All 4 services registered. OK."

      - name: Ensure persistent services are running (self-healing)
        run: |
          # com.penny.export is StartInterval-based — it runs on a timer, not continuously.
          # Only watcher, webhook, and tasks must maintain a live PID at all times.
          PERSISTENT_LABELS="com.penny.watcher com.penny.webhook com.penny.tasks"
          UID_ON_MAC=$(ssh macmini "id -u")
          RESTARTED=""

          for LABEL in $PERSISTENT_LABELS; do
            PID=$(ssh macmini "launchctl list | grep '$LABEL'" | awk '{print $1}')
            if [ "$PID" = "-" ] || [ -z "$PID" ]; then
              echo "WARNING: $LABEL not running — attempting restart..."
              ssh macmini "launchctl kickstart -k gui/${UID_ON_MAC}/${LABEL}" \
                && echo "$LABEL restarted via kickstart." \
                || echo "kickstart returned non-zero (may already be starting)"
              RESTARTED="$RESTARTED $LABEL"
            else
              echo "$LABEL running (PID=$PID). OK."
            fi
          done

          if [ -n "$RESTARTED" ]; then
            echo "Waiting 15s for restarted services to stabilize..."
            sleep 15
            STILL_DOWN=""
            for LABEL in $PERSISTENT_LABELS; do
              PID=$(ssh macmini "launchctl list | grep '$LABEL'" | awk '{print $1}')
              if [ "$PID" = "-" ] || [ -z "$PID" ]; then
                STILL_DOWN="$STILL_DOWN $LABEL"
              else
                echo "$LABEL recovered (PID=$PID). OK."
              fi
            done
            if [ -n "$STILL_DOWN" ]; then
              echo "ERROR: These services failed to restart:$STILL_DOWN"
              ssh macmini "launchctl list | grep com.penny"
              exit 1
            fi
            echo "All restarted services confirmed running."
          fi

      - name: Check watcher is polling (log updated in last 15 min, self-healing)
        run: |
          LAST=$(ssh macmini "stat -f '%m' ~/.penny/logs/watcher.log")
          NOW=$(date +%s)
          AGE=$(( NOW - LAST ))
          if [ "$AGE" -gt 900 ]; then
            echo "WARNING: Watcher log last updated ${AGE}s ago (>15 min). Restarting watcher..."
            UID_ON_MAC=$(ssh macmini "id -u")
            ssh macmini "launchctl kickstart -k gui/${UID_ON_MAC}/com.penny.watcher"
            echo "Waiting 90s for watcher to complete a poll cycle..."
            sleep 90
            LAST=$(ssh macmini "stat -f '%m' ~/.penny/logs/watcher.log")
            NOW=$(date +%s)
            AGE=$(( NOW - LAST ))
            if [ "$AGE" -gt 900 ]; then
              echo "ERROR: Watcher log still stale after restart (${AGE}s ago)"
              ssh macmini "tail -10 ~/.penny/logs/watcher.log"
              exit 1
            fi
            echo "Watcher recovered — log is now ${AGE}s old."
          else
            echo "Watcher log updated ${AGE}s ago. OK."
          fi

      - name: Check tasks poller (self-healing on repeated errors)
        run: |
          LOG="~/.penny/logs/tasks.system.log"
          ERRORS=$(ssh macmini "tail -20 $LOG 2>/dev/null | grep -c 'ERROR'" || echo 0)
          RECENT_OK=$(ssh macmini "tail -20 $LOG 2>/dev/null | grep -c 'connected\|Processed\|No new tasks'" || echo 0)
          echo "Tasks poller — recent errors: $ERRORS, recent successes: $RECENT_OK"
          if [ "$ERRORS" -gt 0 ] && [ "$RECENT_OK" -eq 0 ]; then
            echo "WARNING: Tasks poller has errors and no successes. Restarting..."
            UID_ON_MAC=$(ssh macmini "id -u")
            ssh macmini "launchctl kickstart -k gui/${UID_ON_MAC}/com.penny.tasks"
            sleep 20
            ERRORS=$(ssh macmini "tail -20 $LOG 2>/dev/null | grep -c 'ERROR'" || echo 0)
            RECENT_OK=$(ssh macmini "tail -20 $LOG 2>/dev/null | grep -c 'connected\|Processed\|No new tasks'" || echo 0)
            if [ "$ERRORS" -gt 0 ] && [ "$RECENT_OK" -eq 0 ]; then
              echo "ERROR: Tasks poller still failing after restart"
              ssh macmini "tail -20 $LOG 2>/dev/null"
              exit 1
            fi
            echo "Tasks poller recovered after restart."
          else
            echo "Tasks poller OK."
          fi

      - name: Check transcript log
        run: |
          COUNT=$(ssh macmini "sqlite3 ~/.penny/transcripts.db 'SELECT count(*) FROM transcripts;'")
          PENDING=$(ssh macmini "sqlite3 ~/.penny/transcripts.db \"SELECT count(*) FROM transcripts WHERE status IN ('pending','failed');\"")
          echo "Transcript log: $COUNT total, $PENDING stuck in pending/failed"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: Transcript log is empty (expected on fresh install only)"
          fi
          if [ "$PENDING" -gt 5 ]; then
            echo "WARNING: $PENDING transcript(s) stuck — may need manual review"
          fi
          # Warnings only — stuck transcripts don't need to fail the health check

      - name: Ensure VoiceMemos is running (self-healing)
        run: |
          PID=$(ssh macmini "pgrep -x VoiceMemos || true")
          if [ -z "$PID" ]; then
            echo "WARNING: VoiceMemos not running — CloudKit sync will fail. Launching..."
            ssh macmini "open -a VoiceMemos"
            sleep 8
            PID=$(ssh macmini "pgrep -x VoiceMemos || true")
            if [ -z "$PID" ]; then
              echo "ERROR: VoiceMemos failed to launch — CloudKit sync will not work"
              exit 1
            fi
            echo "VoiceMemos launched (PID=$PID)."
          else
            echo "VoiceMemos running (PID=$PID). OK."
          fi
